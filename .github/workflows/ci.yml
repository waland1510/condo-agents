name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore CondoAgents.slnx
      - run: dotnet format CondoAgents.slnx --verify-no-changes --no-restore
      - run: dotnet build CondoAgents.slnx --no-restore --configuration Release
      - run: dotnet test --solution CondoAgents.slnx --no-build --configuration Release
